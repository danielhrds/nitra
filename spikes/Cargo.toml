# WebRTC spikes (str0m vs rtc). Disposable: removed once the
# decision is made. A separate workspace so the main build, its lock file and
# scripts/check.ps1 stay free of the WebRTC stacks.
[workspace]
resolver = "3"
members = ["webrtc-harness", "webrtc-str0m", "webrtc-rtc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
encode = { path = "../crates/encode" }
webrtc-harness = { path = "webrtc-harness" }
clap = { version = "4.6.8", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = "0.62.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
