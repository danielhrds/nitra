# UI design prototype (visual check of the design brief in Dear ImGui).
# Disposable: removed once checked. A separate workspace so the main build,
# its lock file and scripts/check.ps1 stay free of the UI framework.
[workspace]
resolver = "3"
members = ["ui-design"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
