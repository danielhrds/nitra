# UI spikes (Dear ImGui vs GPUI). Disposable: removed once
# the decision is made. A separate workspace so the main build, its lock
# file and scripts/check.ps1 stay free of the UI frameworks.
[workspace]
resolver = "3"
members = ["feed", "imgui", "gpui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
decode = { path = "../crates/decode" }
encode = { path = "../crates/encode" }
gpu = { path = "../crates/gpu" }
capture = { path = "../crates/capture" }
mf = { path = "../crates/mf" }
present = { path = "../crates/present" }
telemetry = { path = "../crates/telemetry" }
feed = { path = "feed" }
windows = "0.62.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

