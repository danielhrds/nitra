[package]
name = "ui-spike-imgui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dear-imgui-rs = { version = "0.22.0", features = ["build-from-source"] }
dear-imgui-sys = { version = "0.22.0", features = ["build-from-source", "backend-shim-win32", "backend-shim-dx11"] }
decode.workspace = true
feed.workspace = true
gpu.workspace = true
present.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
