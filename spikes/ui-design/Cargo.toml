[package]
name = "ui-design"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dear-imgui-rs = { version = "0.22.0", features = ["build-from-source", "freetype"] }
dear-imgui-sys = { version = "0.22.0", features = ["build-from-source", "backend-shim-win32", "backend-shim-dx11", "freetype"] }
decode = { path = "../../crates/decode" }
encode = { path = "../../crates/encode" }
gpu = { path = "../../crates/gpu" }
mf = { path = "../../crates/mf" }
present = { path = "../../crates/present" }
telemetry = { path = "../../crates/telemetry" }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
