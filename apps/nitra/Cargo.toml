[package]
name = "nitra"
description = "The nitra app: the window (nitra.exe) and the command line (nitra-cli.exe)."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The library holds the app; the two executables only pick how it runs. Not
# named `nitra` like the window's executable: same-named outputs collide.
[lib]
name = "nitra_app"

[lints]
workspace = true

[dependencies]
audio.workspace = true
capture.workspace = true
clap.workspace = true
dear-imgui-rs = { version = "0.22.0", features = ["build-from-source", "freetype"] }
dear-imgui-sys = { version = "0.22.0", features = ["build-from-source", "backend-shim-win32", "backend-shim-dx11", "freetype"] }
decode.workspace = true
encode.workspace = true
gpu.workspace = true
identity.workspace = true
mf.workspace = true
pipeline.workspace = true
present.workspace = true
serde.workspace = true
serde_json.workspace = true
rooms.workspace = true
signaling.workspace = true
telemetry.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
transport.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
