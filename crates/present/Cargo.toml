[package]
name = "present"
description = "VideoPresenter: decoded NV12 frames shown in a window of their own (flip-model swap chain, video processor, statistics overlay)."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gpu.workspace = true
serde.workspace = true
telemetry.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
capture.workspace = true
# DPI awareness and handle counts in tests.
windows = { workspace = true, features = ["Win32_UI_HiDpi", "Win32_System_Threading"] }
