[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
amf = { path = "crates/amf" }
capture = { path = "crates/capture" }
decode = { path = "crates/decode" }
encode = { path = "crates/encode" }
gpu = { path = "crates/gpu" }
mf = { path = "crates/mf" }
pipeline = { path = "crates/pipeline" }
present = { path = "crates/present" }
telemetry = { path = "crates/telemetry" }

clap = { version = "4.6.8", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows = "0.62.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
